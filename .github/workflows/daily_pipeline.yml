name: Daily ERCOT Pipeline Run

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (7:00 PM CDT)
    - cron: '0 0 * * *'
  # Allows manual execution anytime via the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Risk Pipeline
        run: python src/run_pipeline.py

      - name: Run Test Suite
        run: python -m pytest

      - name: Commit and Push Updated Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/ results/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-update: Daily ERCOT market data & risk metrics [skip ci]"
            git pull --rebase origin main
            git push
          fi