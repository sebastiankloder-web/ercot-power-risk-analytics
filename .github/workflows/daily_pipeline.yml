name: Daily ERCOT Pipeline Run

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (7:00 PM CDT)
    - cron: '0 0 * * *'
  # Allows manual execution anytime via the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Risk Pipeline
        run: python src/run_pipeline.py

      - name: Run Test Suite
        run: python -m pytest

      - name: Commit and Push Updated Results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: Daily ERCOT market data & risk metrics [skip ci]"
          file_pattern: 'data/ results/'
